[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_GOOGLE_CLIENT_ID = "1046058827384-b9vgggfg7pg36uso4255eabi51gleoqm.apps.googleusercontent.com"

# Domain canonical redirect from legacy Netlify hostnames
[[redirects]]
  from = "https://unlost-personal.netlify.app/*"
  to = "https://unlost-app.netlify.app/:splat"
  status = 301
  force = true

# Serve static SEO files directly without hitting SPA catch-all
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# Redirect API requests to Vercel production backend
[[redirects]]
  from = "/api/*"
  to = "https://unlost-backend-mu.vercel.app/api/:splat"
  status = 200

# SPA fallback routing for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
