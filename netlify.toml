[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_GOOGLE_CLIENT_ID = "1046058827384-b9vgggfg7pg36uso4255eabi51gleoqm.apps.googleusercontent.com"

# Redirect API requests to Vercel production backend
[[redirects]]
  from = "/api/*"
  to = "https://unlost-backend-mu.vercel.app/api/:splat"
  status = 200

# SPA fallback routing for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
